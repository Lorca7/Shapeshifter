name: Build macOS app

on:
  push:
    branches: ["**"]
    paths:
      - "macos/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "test/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # A current image. The binary still targets macOS 13+, so it runs on
    # Sonoma 14.6 regardless of the OS it was compiled on.
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # The Mac app uses WebKit, so test the editor in WebKit with real mouse input.
      - name: Test the editor in WebKit
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install webkit
          BROWSER=webkit node test/smoke.mjs

      - name: Build Shapeshifter.app (universal)
        env:
          UNIVERSAL: "1"
        run: ./macos/build.sh

      - name: Verify the bundle
        run: |
          APP=build/Shapeshifter.app
          test -x "$APP/Contents/MacOS/Shapeshifter" || { echo "no executable"; exit 1; }
          test -f "$APP/Contents/Resources/web/index.html" || { echo "editor missing"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Shapeshifter")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -q arm64  || { echo "missing arm64";  exit 1; }
          echo "$ARCHS" | grep -q x86_64 || { echo "missing x86_64"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          du -sh "$APP"

      - name: Build the disk image
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          ditto build/Shapeshifter.app "$STAGE/Shapeshifter.app"

          # Retina-aware background: one TIFF holding both resolutions.
          tiffutil -cathidpicheck macos/dmg-background.png macos/dmg-background@2x.png \
            -out "$RUNNER_TEMP/background.tiff"

          brew install create-dmg >/dev/null 2>&1 || true
          if command -v create-dmg >/dev/null 2>&1 && create-dmg \
              --volname "Shapeshifter" \
              --volicon build/Shapeshifter.app/Contents/Resources/AppIcon.icns \
              --background "$RUNNER_TEMP/background.tiff" \
              --window-pos 200 120 \
              --window-size 660 400 \
              --icon-size 112 \
              --icon "Shapeshifter.app" 165 200 \
              --hide-extension "Shapeshifter.app" \
              --app-drop-link 495 200 \
              --no-internet-enable \
              Shapeshifter.dmg "$STAGE"; then
            echo "Built a styled disk image."
          else
            # Finder scripting can fail on a headless runner. Fall back to a
            # plain image that still has the Applications drop target.
            echo "Styled image failed; building a plain one."
            rm -f Shapeshifter.dmg
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname Shapeshifter -srcfolder "$STAGE" -ov -format UDZO Shapeshifter.dmg
          fi
          ls -lh Shapeshifter.dmg
          shasum -a 256 Shapeshifter.dmg | tee checksum.txt

      - name: Install from the disk image, then test the installed app
        run: |
          set -euo pipefail
          MOUNT="$(hdiutil attach -nobrowse -readonly Shapeshifter.dmg | awk -F'\t' '/\/Volumes\// {print $NF}')"
          echo "Mounted at: $MOUNT"
          ls -la "$MOUNT"
          test -d "$MOUNT/Shapeshifter.app" || { echo "app missing from image"; exit 1; }
          test -e "$MOUNT/Applications"     || { echo "Applications drop target missing"; exit 1; }

          # "Drag" it out, exactly as Finder would copy it.
          INSTALL="$(mktemp -d)"
          ditto "$MOUNT/Shapeshifter.app" "$INSTALL/Shapeshifter.app"
          hdiutil detach "$MOUNT"
          codesign --verify --deep --strict "$INSTALL/Shapeshifter.app"

          # 1. It launches the way a double-click launches it.
          open "$INSTALL/Shapeshifter.app"
          sleep 10
          pgrep -x Shapeshifter >/dev/null || { echo "installed copy did not stay running"; exit 1; }
          pkill -x Shapeshifter || true
          sleep 2

          # 2. It does the actual job. The app opens a photo, traces an outline,
          #    saves through the same path as the Save panel and exits.
          SHAPESHIFTER_SELFTEST_PHOTO="$PWD/test/fixtures/photo.png" \
          SHAPESHIFTER_SELFTEST_OUTPUT="$RUNNER_TEMP/app-cutout.png" \
            "$INSTALL/Shapeshifter.app/Contents/MacOS/Shapeshifter" | tee "$RUNNER_TEMP/selftest.log"
          grep -q "SELFTEST PASS" "$RUNNER_TEMP/selftest.log"

          # 3. The file it saved really is the shape that was traced.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" test/verify-cutout.py "$RUNNER_TEMP/app-cutout.png"

      - uses: actions/upload-artifact@v4
        with:
          name: Shapeshifter-macOS
          path: |
            Shapeshifter.dmg
            checksum.txt
          retention-days: 90

      - name: Publish a downloadable release
        if: github.ref_name == 'claude/pensive-dirac-h7rdca' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="macos-build"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Shapeshifter.dmg \
            --title "Shapeshifter for macOS" \
            --notes-file macos/RELEASE_NOTES.md
          gh release view "$TAG" --json url --jq '"Download page: " + .url'
