<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapeshifter</title>
<meta name="description" content="Trace an object in a photo, erase everything else, and save it in its own shape.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 20 L12 6 L20 14 L26 9 L28 26 Z' fill='%235eead4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app" data-state="empty">

  <header class="bar">
    <strong class="brand">Shapeshifter</strong>
    <p class="hint" id="hint" role="status" aria-live="polite">Drop a photo anywhere, or choose one.</p>
    <div class="actions">
      <button class="btn quiet" id="openBtn" type="button">Open photo…</button>
      <button class="btn" id="undoBtn" type="button" disabled>Undo</button>
      <button class="btn" id="resetBtn" type="button" disabled>Start over</button>
      <button class="btn primary" id="primaryBtn" type="button" disabled>Finish outline</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas class="canvas" id="canvas"></canvas>

    <div class="welcome">
      <svg viewBox="0 0 64 64" class="welcome-mark" aria-hidden="true">
        <path d="M8 46 L22 14 L36 34 L46 22 L56 54 Z" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linejoin="round"/>
        <g fill="currentColor"><circle cx="8" cy="46" r="3.2"/><circle cx="22" cy="14" r="3.2"/>
          <circle cx="36" cy="34" r="3.2"/><circle cx="46" cy="22" r="3.2"/><circle cx="56" cy="54" r="3.2"/></g>
      </svg>
      <h1>Drop a photo here</h1>
      <p>JPEG, PNG or TIFF. Trace the object you want to keep and everything else disappears.</p>
      <button class="btn primary big" id="chooseBtn" type="button">Choose a photo…</button>
    </div>

    <div class="zoom" aria-label="Zoom">
      <button class="btn quiet icon" id="zoomOutBtn" type="button" title="Zoom out (−)">−</button>
      <button class="btn quiet" id="fitBtn" type="button" title="Fit the photo in the window (0)">Fit</button>
      <button class="btn quiet icon" id="zoomInBtn" type="button" title="Zoom in (+)">+</button>
    </div>

    <div class="drop"><span>Drop to open</span></div>
  </main>
</div>

<input type="file" id="fileInput" hidden
       accept=".jpg,.jpeg,.png,.tif,.tiff,.webp,image/jpeg,image/png,image/tiff,image/webp">
<script type="module" src="js/app.js"></script>
</body>
</html>
